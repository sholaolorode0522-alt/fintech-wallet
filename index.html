<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SholaPay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto}
:root{--bg:#0a0a0a;--card:#1a1a1a;--border:#2a2a2a;--text:#fff;--sub:#888}
body{background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto}
#authPage{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:380px}
.tab{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px}
.tab div{flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;font-weight:600}
.tab div.active{background:var(--text);color:var(--bg)}
.app{padding:20px;padding-bottom:80px;display:none}
.inline-alert{padding:12px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none;font-weight:600}
.inline-alert.error{background:#ff3b3020;color:#ff3b30;border:1px solid #ff3b30;display:block}
.inline-alert.success{background:#00ff8820;color:#00ff88;border:1px solid #00ff88;display:block}
.inline-alert.info{background:#3b82f620;color:#3b82f6;border:1px solid #3b82f6;display:block}
.btn-full{width:100%;background:#00ff88;color:#000;padding:16px;border-radius:12px;font-weight:700;border:none;cursor:pointer;margin-top:10px;font-size:16px}
.btn-dark{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);padding:14px;border-radius:12px;font-weight:600;cursor:pointer;margin-top:10px}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin:8px 0;font-size:15px}
#otpModal,#forgotModal,#modal,#allPage,#detailPage,#settingsPage{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:20px;z-index:200;overflow-y:auto}
.modal-box{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:360px;border:1px solid var(--border);margin:auto}
.otp-box{display:flex;gap:8px;justify-content:center;margin:15px 0}
.otp-box input{width:40px;height:48px;text-align:center;font-size:20px;font-weight:700;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.acct-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;margin-bottom:20px}
.balance-card{background:linear-gradient(135deg,#00ff88,#00cc6a);border-radius:20px;padding:22px;margin-bottom:20px;color:#000}
.transactions{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border)}
.t-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:12px 0;z-index:50}
.nav-item{text-align:center;color:var(--sub);font-size:11px;cursor:pointer}.nav-item.active{color:#00ff88}
</style>
</head>
<body>

<div id="authPage">
<div class="auth-box">
<h1>SholaPay 💳</h1>
<div class="tab"><div id="tabLogin" class="active" onclick="switchTab('login')">Login</div><div id="tabSignup" onclick="switchTab('signup')">Sign Up</div></div>
<div id="inlineMsg" style="display:none" class="inline-alert"></div>

<div id="loginForm">
<input class="input" id="loginEmail" placeholder="Email" onkeydown="if(event.key==='Enter') handleLogin()">
<input class="input" id="loginPass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter') handleLogin()">
<button class="btn-full" onclick="handleLogin()" type="button">Login</button>
<div style="text-align:center;margin-top:18px;border-top:1px solid var(--border);padding-top:12px">
<button onclick="openForgot()" type="button" style="background:none;border:none;color:#888;text-decoration:underline;font-size:13px;cursor:pointer">Forgot Password? Click here</button>
</div>
</div>

<div id="signupForm" style="display:none">
<input class="input" id="suName" placeholder="Full Name">
<input class="input" id="suPhone" placeholder="Phone (11 digits)" maxlength="11">
<input class="input" id="suEmail" placeholder="Email">
<input class="input" id="suPass" type="password" placeholder="Password (letter+number+!@#$)">
<button class="btn-full" onclick="handleSignup()" type="button">Create Account</button>
</div>
</div>
</div>

<div id="otpModal"><div class="modal-box">
<h3>Verify OTP</h3>
<p id="otpInfo" style="color:#888;font-size:13px">Code sent</p>
<div class="inline-alert info" id="otpCodeDisplay"></div>
<div class="otp-box"><input id="o1" maxlength="1" oninput="if(this.value)document.getElementById('o2').focus()"><input id="o2" maxlength="1" oninput="if(this.value)document.getElementById('o3').focus()"><input id="o3" maxlength="1" oninput="if(this.value)document.getElementById('o4').focus()"><input id="o4" maxlength="1" oninput="if(this.value)document.getElementById('o5').focus()"><input id="o5" maxlength="1" oninput="if(this.value)document.getElementById('o6').focus()"><input id="o6" maxlength="1"></div>
<button class="btn-full" onclick="verifyOtp()" type="button">Verify</button>
</div></div>

<div id="forgotModal"><div class="modal-box">
<h2>Forgot Password</h2>
<div id="forgotStep1">
<p style="color:#888;font-size:13px;margin:10px 0">Enter your registered email</p>
<input class="input" id="forgotEmail" placeholder="e.g shola@gmail.com">
<div id="forgotErr" style="display:none" class="inline-alert error"></div>
<button class="btn-full" onclick="sendForgotOtp()" type="button">Send Code</button>
<button class="btn-dark" onclick="closeForgot()" type="button">Back to Login</button>
</div>
<div id="forgotStep2" style="display:none">
<div class="inline-alert info" id="forgotCodeDisplay"></div>
<p style="font-size:13px;color:#888">Code sent to <b id="forgotEmailShow"></b></p>
<input class="input" id="forgotOtp" placeholder="Enter 6-digit code">
<input class="input" id="forgotNewPass" type="password" placeholder="New Password (letter+number+symbol)">
<div id="forgotErr2" style="display:none" class="inline-alert error"></div>
<button class="btn-full"
