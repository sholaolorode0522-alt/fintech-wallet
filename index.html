<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fintech Wallet - $40k</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto}
body{background:#0a0a0a;color:#fff;min-height:100vh;padding:20px;max-width:480px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-size:18px;font-weight:700}
.balance-card{background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid #2a2a2a}
.label{color:#888;font-size:13px;margin-bottom:8px}
.amount{font-size:36px;font-weight:800;color:#00ff88;margin-bottom:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:14px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.btn-green{background:#00ff88;color:#000}
.btn-dark{background:#2a2a2a;color:#fff;border:1px solid #3a3a3a}
.transactions{background:#1a1a1a;border-radius:16px;padding:20px;border:1px solid #2a2a2a}
.t-head{display:flex;justify-content:space-between;margin-bottom:16px;font-weight:600}
.t-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #252525}
.t-item:last-child{border:none}
.t-left{display:flex;gap:12px;align-items:center}
.icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.icon-send{background:#ff3b30}
.icon-recv{background:#00ff88;color:#000}
.icon-bill{background:#3a3a3a}
.t-name{font-size:14px;font-weight:600}
.t-date{font-size:12px;color:#888;margin-top:2px}
.t-amt{font-weight:700;font-size:14px}
.negative{color:#ff3b30}
.positive{color:#00ff88}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal-box{background:#1e1e1e;border-radius:16px;padding:24px;width:100%;max-width:360px;border:1px solid #333}
.input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:10px 0;font-size:16px}
</style>
</head>
<body>
<div class="header"><div class="logo">💳 Fintech Wallet</div><div style="color:#888">● Live</div></div>
<div class="balance-card">
<div class="label">Available Balance</div>
<div class="amount" id="bal">$40,000.00</div>
<div class="actions">
<button class="btn btn-green" onclick="openModal()">Send Money</button>
<button class="btn btn-dark" onclick="receive()">Receive</button>
</div>
</div>
<div class="transactions">
<div class="t-head"><span>Transactions</span><span style="color:#00ff88;font-size:12px">View All</span></div>
<div id="list"></div>
</div>
<div id="modal">
<div class="modal-box">
<h3 style="margin-bottom:12px">Send Money</h3>
<input class="input" id="to" placeholder="Recipient name / account">
<input class="input" id="amt" type="number" placeholder="Amount">
<div style="display:flex;gap:10px;margin-top:12px">
<button class="btn btn-dark" style="flex:1" onclick="closeModal()">Cancel</button>
<button class="btn btn-green" style="flex:1" onclick="send()">Send</button>
</div>
</div>
</div>
<script>
let balance=40000;
let tx=[
{name:"Spotify Premium",date:"Today",amt:-9.99,type:"bill"},
{name:"Salary Received",date:"Yesterday",amt:2500,type:"recv"},
{name:"Transfer to David",date:"Nov 1",amt:-500,type:"send"},
{name:"Electric Bill",date:"Oct 30",amt:-120.5,type:"bill"},
{name:"Freelance Payment",date:"Oct 28",amt:1200,type:"recv"},
{name:"Uber Trip",date:"Oct 27",amt:-24.3,type:"bill"}
];
function render(){
document.getElementById('bal').textContent='$'+balance.toLocaleString('en-US',{minimumFractionDigits:2});
let h='';
tx.forEach(t=>{
let ic=t.type=='send'?'📤':t.type=='recv'?'📥':'🧾';
let icClass=t.type=='send'?'icon-send':t.type=='recv'?'icon-recv':'icon-bill';
let cls=t.amt>0?'positive':'negative';
let sign=t.amt>0?'+':'';
h+=`<div class="t-item"><div class="t-left"><div class="icon ${icClass}">${ic}</div><div><div class="t-name">${t.name}</div><div class="t-date">${t.date}</div></div></div><div class="t-amt ${cls}">${sign}$${Math.abs(t.amt).toLocaleString()}</div></div>`;
});
document.getElementById('list').innerHTML=h;
}
function openModal(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function send(){
let to=document.getElementById('to').value||'Unknown';
let amt=parseFloat(document.getElementById('amt').value);
if(!amt||amt<=0){alert('Enter valid amount');return}
if(amt>balance){alert('Insufficient balance');return}
balance-=amt;
tx.unshift({name:'Transfer to '+to,date:'Just now',amt:-amt,type:'send'});
render();closeModal();
document.getElementById('to').value='';document.getElementById('amt').value='';
alert('Sent $'+amt+' to '+to);
}
function receive(){
let amt=500;
balance+=amt;
tx.unshift({name:'Received Payment',date:'Just now',amt:amt,type:'recv'});
render();alert('You received $500!');
}
render();
</script>
</body>
</html>
