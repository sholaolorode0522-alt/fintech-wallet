<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fintech Wallet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto}
body{background:#0a0a0a;color:#fff;min-height:100vh;padding:20px;max-width:480px;margin:0 auto}
.acct-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.balance-card{background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid #2a2a2a}
.label{color:#888;font-size:13px;margin-bottom:8px}.amount{font-size:36px;font-weight:800;color:#00ff88;margin-bottom:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:14px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.btn-green{background:#00ff88;color:#000}.btn-dark{background:#2a2a2a;color:#fff;border:1px solid #3a3a3a}
.transactions{background:#1a1a1a;border-radius:16px;padding:20px;border:1px solid #2a2a2a}
.t-head{display:flex;justify-content:space-between;margin-bottom:16px;font-weight:600}
.t-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #252525}
.t-left{display:flex;gap:12px;align-items:center}.icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover}
.icon-send{background:#ff3b30}.icon-recv{background:#00ff88;color:#000}.icon-bill{background:#3a3a3a}
.t-name{font-size:14px;font-weight:600}.t-date{font-size:12px;color:#888}.t-amt{font-weight:700}.negative{color:#ff3b30}.positive{color:#00ff88}
#modal,#allPage{position:fixed;inset:0;background:#0a0a0a;display:none;flex-direction:column;padding:20px;z-index:10;overflow-y:auto}
.modal-box{background:#1e1e1e;border-radius:16px;padding:24px;width:100%;max-width:360px;border:1px solid #333;margin:auto}
.input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0;font-size:16px}
.name-verify{background:#00ff88;color:#000;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;margin-top:4px;display:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
</style>
</head>
<body>
<div class="acct-box"><div><div style="color:#888;font-size:11px">ACCOUNT NUMBER</div><div style="font-weight:700;letter-spacing:1px">8099887766</div></div><div style="text-align:right"><div style="color:#888;font-size:11px">ACCOUNT NAME</div><div style="font-weight:600;font-size:14px">SHOLA OLORODE</div></div></div>
<div class="balance-card"><div class="label">Available Balance</div><div class="amount" id="bal">$40,000.00</div><div class="actions"><button class="btn btn-green" onclick="openModal()">Send Money</button><button class="btn btn-dark" onclick="receive()">Receive</button></div></div>
<div class="transactions"><div class="t-head"><span>Transactions</span><span style="color:#00ff88;font-size:12px;cursor:pointer" onclick="openAll()">View All</span></div><div id="list"></div></div>

<div id="modal" style="align-items:center;justify-content:center;background:rgba(0,0,0,0.85)"><div class="modal-box"><h3>Send Money</h3><input class="input" id="acct" type="tel" maxlength="10" placeholder="Enter 10-digit account number" oninput="verifyAcct()"><div id="verify" class="name-verify"></div><input class="input" id="amt" type="number" placeholder="Amount"><div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-dark" style="flex:1" onclick="closeModal()">Cancel</button><button class="btn btn-green" style="flex:1" onclick="send()">Send</button></div><p style="color:#666;font-size:11px;margin-top:10px">Try: 0123456789, 1234567890</p></div></div>

<div id="allPage"><div class="top-bar"><h2>All Transactions</h2><button class="btn btn-dark" onclick="closeAll()">Close ✕</button></div><div id="allList"></div></div>

<script>
let balance=40000;
let tx=[
{name:"Spotify Premium",date:"Today",amt:-9.99,type:"bill",pic:""},
{name:"Salary Received",date:"Yesterday",amt:2500,type:"recv",pic:""},
{name:"Transfer to David",date:"Nov 1",amt:-500,type:"send",pic:"https://i.pravatar.cc/100?img=11"},
{name:"Electric Bill",date:"Oct 30",amt:-120.5,type:"bill",pic:""},
{name:"Freelance Payment",date:"Oct 28",amt:1200,type:"recv",pic:"https://i.pravatar.cc/100?img=32"},
{name:"Netflix",date:"Oct 25",amt:-15.99,type:"bill",pic:""},
{name:"Amaka Johnson",date:"Oct 20",amt:-2000,type:"send",pic:"https://i.pravatar.cc/100?img=5"}
];
const bankDB={"0123456789":"DAVID ADEBAYO","1234567890":"MUM - BLESSING OLORODE","8099887766":"SHOLA OLORODE (You)","9088776655":"TUNDE BAKARE","8077665544":"AMAKA JOHNSON"};
let currentName="";
function render(){
document.getElementById('bal').textContent='$'+balance.toLocaleString('en-US',{minimumFractionDigits:2});
let h='';tx.slice(0,5).forEach(t=>{h+=itemHTML(t)});document.getElementById('list').innerHTML=h;
let h2='';tx.forEach(t=>{h2+=itemHTML(t)});document.getElementById('allList').innerHTML=h2;
}
function itemHTML(t){
let icClass=t.type=='send'?'icon-send':t.type=='recv'?'icon-recv':'icon-bill';
let cls=t.amt>0?'positive':'negative';let sign=t.amt>0?'+':'';
let imgPart=t.pic?`<img src="${t.pic}">`:`${t.type=='send'?'↑':t.type=='recv'?'↓':'$'}`;
return `<div class="t-item"><div class="t-left"><div class="icon ${icClass}">${imgPart}</div><div><div class="t-name">${t.name}</div><div class="t-date">${t.date}</div></div></div><div class="t-amt ${cls}">${sign}$${Math.abs(t.amt).toLocaleString()}</div></div>`;
}
function openModal(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('verify').style.display='none';document.getElementById('acct').value='';document.getElementById('amt').value=''}
function openAll(){document.getElementById('allPage').style.display='flex'}function closeAll(){document.getElementById('allPage').style.display='none'}
function verifyAcct(){let num=document.getElementById('acct').value;let box=document.getElementById('verify');if(num.length==10){if(bankDB[num]){currentName=bankDB[num];box.textContent="✓ "+currentName;box.style.background="#00ff88";box.style.display="block";}else{currentName="NEW BENEFICIARY";box.textContent="✓ NEW BENEFICIARY - "+num;box.style.background="#ffcc00";box.style.display="block";}}else{box.style.display="none";currentName="";}}
function send(){let amt=parseFloat(document.getElementById('amt').value);if(!document.getElementById('acct').value||document.getElementById('acct').value.length<10){alert('Enter 10-digit account number');return}if(!amt||amt<=0){alert('Enter amount');return}if(amt>balance){alert('Insufficient balance');return}balance-=amt;tx.unshift({name:'Transfer to '+currentName,date:'Just now',amt:-amt,type:'send',pic:""});render();closeModal();alert('Sent $'+amt+' to '+currentName+' ✓');}
function receive(){let amt=500;balance+=amt;tx.unshift({name:'Received Payment',date:'Just now',amt:amt,type:'recv',pic:""});render();alert('You received $500!')}
render();
</script>
</body>
</html>
